{% extends 'shop/base.html' %}
{% load static %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm text-center">
                <div class="card-body py-5">
                    <h2 class="text-success mb-4">✅ Пароль успешно изменён!</h2>
                    <p class="text-muted">Ваш пароль был обновлён. Теперь вы можете использовать новый пароль для входа.</p>
                    <div class="mt-4">
                        <a href="{% url 'shop:settings' %}" class="btn btn-primary">⚙️ К настройкам</a>
                        <a href="{% url 'shop:profile' %}" class="btn btn-outline-secondary"> В личный кабинет</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
