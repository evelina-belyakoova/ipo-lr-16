{% extends 'shop/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-success text-white">Регистрация</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                </form>
             
            </div>
        </div>
    </div>
</div>
{% endblock %}
